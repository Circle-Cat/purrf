<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Course</title>
    <style>
      html, body { margin: 0; height: 100%; }
      iframe { border: 0; width: 100%; height: 100%; display: block; }
      #loading, #failed {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #fff;
        color: #52525b;
        font: 14px/1.4 system-ui, -apple-system, sans-serif;
      }
      #loading b {
        width: 28px;
        height: 28px;
        border: 3px solid #e4e4e7;
        border-top-color: #71717a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #loading b { animation-duration: 2.4s; }
      }
      #failed { gap: 4px; }
      #failed .hint { color: #71717a; }
      [hidden] { display: none !important; }
    </style>
    <script src="__scorm12.min.js"></script>
  </head>
  <body>
    <!--
      Nothing is on screen between this document loading and the course's own
      entry document being up: the handshake below has to complete before the
      course frame is even created. This covers that stretch, and the course
      takes over painting from the moment its entry loads.
    -->
    <div id="loading" role="status">
      <b></b>
      <span>Loading course...</span>
    </div>
    <div id="failed" role="alert" hidden>
      <span>The course could not be loaded.</span>
      <span class="hint">Reload this page to try again.</span>
    </div>
    <script type="module">
      import { MESSAGE_TYPES, toFlattenedCmi } from "./__bridge.js";

      // The app origin is handed over in the query string rather than compiled
      // in, because it differs per environment and this file ships in the image.
      const appOrigin = new URLSearchParams(location.search).get("appOrigin");

      const post = (message) => parent.postMessage(message, appOrigin);

      let api = null;

      // Everything below runs only after scorm:init: the CMI model has to be
      // in memory before the course frame exists, or the course's first
      // LMSGetValue returns empty and the learner silently loses their place.
      window.addEventListener("message", (event) => {
        if (event.origin !== appOrigin || event.data?.type !== MESSAGE_TYPES.INIT) {
          return;
        }
        if (api) {
          return;
        }
        start(event.data);
      });

      function start({ progress, learner, entryPath }) {
        api = new window.Scorm12API({
          autocommit: false,
          logLevel: 4,
          // Flattened dot-keys, not scorm-again's default nested JSON --
          // the backend's commit parsing reads "cmi.core.lesson_status" keys.
          dataCommitFormat: "flattened",
          // No lmsCommitUrl on purpose: this origin must never reach the API.
        });
        api.loadFromFlattenedJSON(toFlattenedCmi(progress, learner));

        api.on("LMSCommit", () =>
          post({ type: MESSAGE_TYPES.COMMIT, cmi: api.renderCommitCMI(true) }),
        );
        api.on("LMSFinish", () =>
          post({ type: MESSAGE_TYPES.FINISH, cmi: api.renderCommitCMI(true) }),
        );

        window.API = api;

        // Whether the course ever got as far as talking to the API. Until it
        // has, an asset that fails to load means nothing started at all --
        // the shape a content-host outage takes, where the entry document
        // arrives and every file behind it does not. Saying so beats a
        // spinner that never stops. Afterwards a stray asset is the running
        // course's own business, and interrupting it would be a lie.
        let started = false;
        api.on("LMSInitialize", () => {
          started = true;
        });

        // An outage takes down every asset at once, so this reports the first
        // one and then stays quiet rather than posting a couple of hundred
        // times.
        const banner = document.getElementById("failed");
        const failed = (resource) => {
          if (started || !banner.hidden) return;
          post({
            type: MESSAGE_TYPES.ERROR,
            code: 0,
            message: `course asset failed to load: ${resource}`,
          });
          document.getElementById("loading")?.remove();
          banner.hidden = false;
        };

        const frame = document.createElement("iframe");
        frame.addEventListener("load", () => {
          document.getElementById("loading")?.remove();
          // Same origin, so the course's own failures are readable from here.
          // Only resource errors count: those name the element that failed,
          // where an exception thrown by the course names the window.
          frame.contentWindow?.addEventListener(
            "error",
            (event) => {
              if (event.target === frame.contentWindow) return;
              failed(event.target?.src || event.target?.href || "unknown");
            },
            true,
          );
        });
        frame.src = entryPath;
        document.body.appendChild(frame);
      }

      window.addEventListener("error", (event) =>
        post({ type: MESSAGE_TYPES.ERROR, code: 0, message: String(event.message) }),
      );

      post({ type: MESSAGE_TYPES.READY });
    </script>
  </body>
</html>
