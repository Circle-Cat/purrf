# Staging-environment overrides, layered on top of values.yaml.
# Read by the ArgoCD `purrf-staging` Application via source.helm.valueFiles.
# These were previously injected by Terraform (module.purrf_instance.helm_release.purrf_app).
# Shared chart defaults (securityContext, cronjobs, resources, ...) stay in values.yaml.

fullnameOverride: purrf-staging
image:
  # Kept on the current Terraform-built image (image path unchanged for now);
  # switching to the CI/GHCR image is a follow-up.
  repository: ghcr.io/circle-cat/purrf
  tag: "b0f76108cc850e6505fa4562aef658ea92e34a0d"
envFrom:
  - secretRef:
      name: purrf-staging
ingress:
  enabled: true
  className: cloudflare2-tunnel
  hosts:
    # SCORM course files, same pods as staging-api. Not covered by any
    # Cloudflare Access application, so every request carries a signed path
    # token. Listed first so the staging branch's own tail of this file, which
    # promote never carries, does not touch the lines this entry sits between.
    - host: staging-training-content.purrf.io
      paths:
        - path: /
          pathType: Prefix
    - host: staging-api.purrf.io
      paths:
        - path: /
          pathType: Prefix
# Run `alembic upgrade head` as an ArgoCD PreSync hook before every staging
# deploy, so a release carrying a schema change no longer needs a manual
# `bazel run //tools/migrate_db`. A failed migration fails the sync and leaves
# the running Deployment untouched.
#
# This switch lives on the staging branch, not on main: promote.yml skips a
# commit that touches only helm/purrf/values-<env>.yaml, so main cannot carry
# it here, and a promote that did touch this file would re-assert main's value.
# Kept at the end of the file so the deploy-staging image-pin commits, which
# rewrite image.tag above, never conflict with it.
migrate:
  enabled: true
# Data syncs staging does not need day to day; start one by hand when a test
# needs fresh data:
#   kubectl -n purrf-staging create job --from=cronjob/purrf-staging-<name> <job-name>
# Lives on the staging branch for the same reason as migrate above. Takes
# effect once the chart's suspendCronjobs support is promoted here.
suspendCronjobs:
  - update-ldap
  - update-jira-projects
  - update-jira-issues
  - update-google-calendar-events
  - gmail-watch-maintain
  - sync-meet-attendance
  # Prod-only jobs: prod holds the real chat subscriptions and the GitHub App.
  - check-chat-subscriptions
  - update-github-activity
  # The leave jobs, always together (see values.yaml). Run them by hand when a
  # test needs a week's accrual or a year's close.
  - leave-weekly-accrual
  - leave-annual-close
