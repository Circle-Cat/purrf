# Staging-environment overrides, layered on top of values.yaml.
# Read by the ArgoCD `purrf-staging` Application via source.helm.valueFiles.
# These were previously injected by Terraform (module.purrf_instance.helm_release.purrf_app).
# Shared chart defaults (securityContext, cronjobs, resources, ...) stay in values.yaml.

fullnameOverride: purrf-staging
image:
  # Kept on the current Terraform-built image (image path unchanged for now);
  # switching to the CI/GHCR image is a follow-up.
  repository: ghcr.io/circle-cat/purrf
  tag: "4893cb4cf044f71b4d9ff01391d34adb6ad8d9ba"
envFrom:
  - secretRef:
      name: purrf-staging
ingress:
  enabled: true
  className: cloudflare2-tunnel
  hosts:
    - host: staging-api.purrf.io
      paths:
        - path: /
          pathType: Prefix
# Run `alembic upgrade head` as an ArgoCD PreSync hook before every staging
# deploy, so a release carrying a schema change no longer needs a manual
# `bazel run //tools/migrate_db`. A failed migration fails the sync and leaves
# the running Deployment untouched.
#
# This switch lives on the staging branch, not on main: promote.yml skips a
# commit that touches only helm/purrf/values-<env>.yaml, so main cannot carry
# it here, and a promote that did touch this file would re-assert main's value.
# Kept at the end of the file so the deploy-staging image-pin commits, which
# rewrite image.tag above, never conflict with it.
migrate:
  enabled: true
