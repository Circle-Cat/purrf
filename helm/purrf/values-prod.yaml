# Prod-environment overrides, layered on top of values.yaml.
# Read by the ArgoCD `purrf-prod` Application via source.helm.valueFiles.
# These were previously injected by Terraform (module.purrf_instance.helm_release.purrf_app).
# Shared chart defaults (securityContext, cronjobs, resources, ...) stay in values.yaml.

fullnameOverride: purrf-prod
image:
  # CI-built image, promoted from staging (prod never rebuilds; the tag below
  # is pinned by the prod promotion to the staging-tested build).
  repository: ghcr.io/circle-cat/purrf
  tag: "ed246796e0ed3fdc58dd37eda8dc5b79b0589eef"
envFrom:
  - secretRef:
      name: purrf-prod
ingress:
  enabled: true
  className: cloudflare2-tunnel
  hosts:
    # SCORM course files, same pods as api. Not covered by any Cloudflare
    # Access application, so every request carries a signed path token.
    - host: training-content.purrf.io
      paths:
        - path: /
          pathType: Prefix
    - host: api.purrf.io
      paths:
        - path: /
          pathType: Prefix
# Run `alembic upgrade head` as an ArgoCD PreSync hook before every prod
# deploy. A failed migration fails the sync and leaves the running
# Deployment untouched. Lives on the prod branch only, like staging's.
migrate:
  enabled: true
releaseTag: release/2026.11.10
