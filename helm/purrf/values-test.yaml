# Test-environment overrides, layered on top of values.yaml.
# Read by the ArgoCD `purrf-test` Application via source.helm.valueFiles.
# These were previously injected by Terraform (module.purrf_instance.helm_release.purrf_app).
# Shared chart defaults (securityContext, cronjobs, resources, ...) stay in values.yaml.

fullnameOverride: purrf-test
image:
  # Public GHCR image. On every push to main, .github/workflows/deploy-test.yml
  # builds the image and commits the new commit-SHA into `tag` below (with
  # [skip ci]); the purrf-test ArgoCD Application syncs it. The "main" value
  # here is just the bootstrap before the first deploy-test run pins a SHA.
  repository: ghcr.io/circle-cat/purrf
  tag: "b15ea22eaf51d006f69a63a76268b1f8f2c6c014"
# The PreSync migration hook runs `alembic upgrade head` against this
# environment's database before the Deployment is applied. A failed migration
# fails the sync, so the pods already running keep serving the old schema.
migrate:
  enabled: true
envFrom:
  - secretRef:
      name: purrf-test
ingress:
  enabled: true
  className: cloudflare-tunnel
  hosts:
    - host: test-api.purrf.io
      paths:
        - path: /
          pathType: Prefix
    # SCORM course files. Same pods as test-api; a separate hostname is the
    # whole point -- course JavaScript runs on this origin and must not be able
    # to read the app's Access cookie or call the API as the learner. This host
    # is deliberately not covered by any Cloudflare Access application, so
    # every request must carry a signed token in its path.
    - host: test-training-content.purrf.io
      paths:
        - path: /
          pathType: Prefix
