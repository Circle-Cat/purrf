{{- range .Values.cronjobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "purrf.fullname" $ }}-{{ .name }}
spec:
  schedule: {{ .schedule | quote }}
  {{- if .concurrencyPolicy }}
  concurrencyPolicy: {{ .concurrencyPolicy }}
  {{- end }}
  {{- if .suspend }}
  suspend: {{ .suspend }}
  {{- end }}
  jobTemplate:
    spec:
      {{- if .activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ .activeDeadlineSeconds }}
      {{- end }}
      template:
        spec:
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          serviceAccountName: {{ include "purrf.serviceAccountName" $ }}
          containers:
            - name: {{ .name }}
              image: {{ $.Values.cronjobDefaults.image }}
              command:
                - /bin/sh
                - -c
              args:
                - |
                  echo "Fetching Google ID Token..."
                  TOKEN=$(curl -s -f -H "Metadata-Flavor: Google" \
                    "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience={{ $.Values.labels.app }}")

                  {{- if hasKey . "body" }}
                  cat << 'EOF' > /tmp/post_body.json
                  {{ toJson .body }}
                  EOF
                  {{- end }}

                  echo "Calling API..."
                  curl -X POST -s -f \
                    -H "Authorization: Bearer $TOKEN" \
                    {{- if hasKey . "body" }}
                    -H "Content-Type: application/json" \
                    -d @/tmp/post_body.json \
                    {{- end }}
                    "http://{{ include "purrf.fullname" $ }}:{{ $.Values.service.port }}{{ .url }}"
                  STATUS=$?

                  # One JSON line per run for Cloud Monitoring to count. The
                  # leading newline keeps it off the end of curl's response body.
                  if [ "$STATUS" -eq 0 ]; then
                    printf '\n{"severity":"INFO","message":"Cron job succeeded","monitor_event":"cron.succeeded","job":"%s"}\n' "{{ .name }}"
                  else
                    printf '\n{"severity":"ERROR","message":"Cron job failed","monitor_event":"cron.failed","job":"%s","curl_exit_code":%d}\n' "{{ .name }}" "$STATUS"
                  fi
                  exit "$STATUS"

              resources:
                {{- if .resources }}
                {{- toYaml .resources | nindent 16 }}
                {{- else }}
                {{- toYaml $.Values.cronjobDefaults.resources | nindent 16 }}
                {{- end }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}

          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: {{ include "purrf.name" $ }}
                        app.kubernetes.io/instance: {{ $.Release.Name }}
                    topologyKey: "kubernetes.io/hostname"

          restartPolicy: OnFailure
{{- end }}