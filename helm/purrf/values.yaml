# Default values for purrf.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: us-docker.pkg.dev/k8s-dev-437501/purrf/purrf
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

labels:
  app: purrf

selectorLabels:
  app: purrf

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  automount: true
  # Annotations to add to the service account
  annotations:
    iam.gke.io/gcp-service-account: "purrf-service@purrf-452300.iam.gserviceaccount.com"
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 65532

securityContext:
  capabilities:
    drop:
      - NET_RAW
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 5001

ingress:
  enabled: true
  className: "cloudflare-tunnel"
  hosts:
    - host: api.purrf.io
      paths:
        - path: /
          pathType: Prefix

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  requests:
    cpu: 50m
    memory: 325Mi

livenessProbe: null
readinessProbe: null

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector:
  cloud.google.com/gke-spot: "true"

tolerations: []

affinity: {}

azureWorkloadIdentity:
  audience: "api://AzureADTokenExchange"
  path: azure-token
  tokenMountPath: "/var/run/secrets/azure/tokens"
  tokenExpirationSeconds: 3600

# Secret configuration
secret:

cronjobDefaults:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

cronjobs:
  - name: update-ldap
    schedule: "20 10 * * *"   # 10:20 UTC
    url: "/api/microsoft/backfill/ldaps"
  - name: update-jira-projects
    schedule: "30 10 * * *"   # 10:30 UTC
    url: "/api/jira/project"
  - name: update-jira-issues
    schedule: "40 10 * * *"   # 10:40 UTC
    url: "/api/jira/update?hours=24"
  - name: update-google-calendar-events
    schedule: "50 10 * * *"   # 10:50 UTC
    url: "/api/google/calendar/history/pull"
    body: {}
  - name: pubsub-sync-hourly
    schedule: "0 * * * *"   # every hour at minute 00
    url: "/api/pubsub/sync"
  - name: sync-recruiting-emails-recent
    schedule: "5 11 * * *"   # 11:05 UTC = 04:05 GMT-7, before HR's workday
    url: "/api/recruiting/emails/sync/recent"
  - name: sync-recruiting-emails-reconcile
    schedule: "35 11 * * 0"  # Sundays 11:35 UTC — backstop for the nightly delta
    url: "/api/recruiting/emails/sync"
  - name: sync-meet-attendance
    schedule: "15 */2 * * *"   # every 2 hours at :15, off the hour to avoid pubsub-sync-hourly
    url: "/api/mentorship/v2/meetings/attendance/sync?lookback_hours=4"
    # A meeting is offered while [now - lookback - 3h, now + 3h] overlaps its
    # own slot (3h = ATTENDANCE_WINDOW_DELTA), so at lookback_hours=4 that is
    # a 10h band against this 2h schedule -- roughly 5 consecutive runs get a
    # chance at each meeting, not just two. What actually constrains
    # lookback + 3h is how late a conference may end relative to its
    # scheduled slot; raise lookback only if that horizon proves too short.
    #
    # That band only decides WHEN a meeting is looked at. Whether it is looked
    # at at all is decided first by its round: only meetings STARTING inside
    # the round's own meeting window (match notification through the
    # meetings-completion deadline) are ever swept. Meetings a pair arranges
    # after the deadline are private and stay untracked, whatever the band says.
    #
    # Conversely, a round does not stop being swept the instant its deadline
    # passes. It remains selectable for lookback + 3h + the longest bookable
    # meeting (= 8.5h at lookback_hours=4), so a meeting held just before the
    # deadline still gets reconciled afterwards; the round's window itself is
    # NOT widened by that allowance. Raising lookback_hours lengthens this tail
    # too. Every round selectable in a given run is swept, each against its own
    # window -- during the tail an ending round and a starting one legitimately
    # overlap, and dropping either would lose meetings at the seam.
    concurrencyPolicy: Forbid
    # A busy run makes one serial Meet list call per selected meeting, plus
    # one participants call per matched conference, and can exceed the
    # interval. concurrencyPolicy: Forbid stays for that reason alone now --
    # completed_count is recalculated from meeting rows, not incremented, so
    # the old double-increment race no longer applies.
    activeDeadlineSeconds: 5400   # 90 min: comfortably longer than any plausible
    # real run, comfortably shorter than the 2-hour schedule interval, so a
    # wedged run under concurrencyPolicy: Forbid is killed before the next
    # trigger instead of skipping every future run forever.
